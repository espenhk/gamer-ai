# Grid search: CMAESPolicy on iRacing ((mu/mu_w, lambda)-CMA-ES)
#
# Phase 1 (action_mode: telemetry_only) reads live telemetry without sending
# actions back; switch to action_mode: live (requires vJoy) for real control.
#
# Primary axes:
#   population_size — lambda in CMA-ES. Drives the total episode budget
#                     (= n_sims * population_size).
#   initial_sigma   — starting step size. CSA adapts sigma automatically
#                     each generation, but the initial value controls how
#                     far the first samples spread.
#
# Combos: 2 x 3 = 6

base_name: "gs_iracing_cmaes_v1"
game: iracing

training_params:
  track: laguna_seca
  speed: 1.0
  n_sims: 30
  in_game_episode_s: 120.0
  action_mode: telemetry_only
  policy_type: cmaes

  # --- Search axes ---
  population_size: [20, 40]
  initial_sigma: [0.1, 0.3, 0.5]

reward_params:
  progress_weight: 10000.0
  centerline_weight: -0.1
  centerline_exp: 2.0
  speed_weight: 0.05
  step_penalty: -0.05
  finish_bonus: 5000.0
  off_track_penalty: -10.0
  lap_time_improvement_bonus: 100.0
  crash_threshold_m: 25.0
