# Grid search: WeightedLinearPolicy (hill_climbing) on iRacing
#
# Phase 1 (action_mode: telemetry_only) reads live telemetry without sending
# actions back; switch to action_mode: live (requires vJoy) for real control.
#
# Primary axes:
#   mutation_scale  — step size of the hill-climbing search. Too small → stuck
#                     in flat reward regions; too large → random walk.
#   mutation_share  — fraction of weights perturbed per mutation. 1.0 mutates
#                     everything; smaller values make more local moves.
#
# iRacing's adapter has no probe/cold-start phase (build_probe returns
# None), so cold_restarts / cold_sims are not meaningful axes here.
#
# n_sims is held fixed so training budget is constant across combos.
#
# Combos: 3 x 2 = 6

base_name: "gs_iracing_hc_v1"
game: iracing

training_params:
  track: laguna_seca
  speed: 1.0
  n_sims: 50
  in_game_episode_s: 120.0
  action_mode: telemetry_only
  policy_type: hill_climbing

  # --- Search axes ---
  mutation_scale: [0.01, 0.05, 0.2]
  mutation_share: [0.5, 1.0]

reward_params:
  progress_weight: 10000.0
  centerline_weight: -0.1
  centerline_exp: 2.0
  speed_weight: 0.05
  step_penalty: -0.05
  finish_bonus: 5000.0
  off_track_penalty: -10.0
  lap_time_improvement_bonus: 100.0
  crash_threshold_m: 25.0
