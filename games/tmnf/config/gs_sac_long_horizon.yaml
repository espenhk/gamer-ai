# TMNF long-horizon SAC run config (issue #489, folding in #494).
#
# This is a single-combo "grid search" (no swept axes) — running it via
# `python grid_search.py games/tmnf/config/gs_sac_long_horizon.yaml --game tmnf`
# creates exactly one experiment, `experiments/tmnf/sac/a03_centerline/gs_sac_long_horizon/`,
# which the crash-restart supervisor described in infrastructure/README.md
# points `main.py` at for the actual multi-day unattended run. You can also
# just create the experiment directory by hand (first `main.py` run copies
# these masters in) and edit training_params.yaml directly — the grid-search
# entry point is only used here for its Cartesian-product-of-one convenience.
#
# Requires `poetry install --with deep_rl` (pulls stable-baselines3 + torch)
# for policy_type: sac.
#
# Config choices, each tracked by its own issue:
#   n_lidar_rays: 16        — raised from the 8-ray default (#489)
#   policy_type: sac        — SB3 Soft Actor-Critic, the algorithm family
#                              external evidence (tmrl, Linesight) says works
#                              for TMNF-family continuous control (#489)
#   action_window_ticks: 5  — ~20 Hz control rate, matching tmrl
#                              (time_step_duration=0.05s) and Linesight
#                              (ms_per_action=50ms) — see
#                              docs/research/tmrl-linesight-reward-obs.md (#494)
#   checkpoint_freq: 20000  — crash-safe resume cadence (#488) sized for a
#                              multi-day run: ~150 checkpoints over a 3M-step
#                              budget, frequent enough that a crash-restart
#                              supervisor (#489) never loses more than a few
#                              minutes of wall-clock progress
#
# NOT yet folded in:
#   - centerline_weight is left at the current master default (-0.083)
#     pending #491's A/B result (progress-only vs. current shaping). Update
#     this file's reward_params.centerline_weight once #491 concludes.
#   - n_lookahead_points / lookahead_step_spacing (#493) are left unset
#     (legacy 3-point schedule) — extending the lookahead is an independent
#     experiment; sweep it separately once the SAC baseline is running.
#   - SAC policy_params below are a starting budget per #489's issue text
#     ("tune against #482's CarRacing findings first"); revisit before
#     committing to the full multi-day run if #482's results suggest
#     different values.

base_name: "gs_sac_long_horizon"
track: a03_centerline

training_params:
  speed: 10.0
  in_game_episode_s: 60.0
  n_lidar_rays: 16
  policy_type: sac
  action_window_ticks: 5
  decision_offset_pct: 0.75

  policy_params:
    total_timesteps: 3000000   # initial budget; extend via crash-safe resume (#488) as needed
    buffer_size: 750000
    batch_size: 256
    learning_starts: 10000
    train_freq: 1
    tau: 0.005
    gamma: 0.99
    checkpoint_freq: 20000

reward_params:
  progress_weight: 10000.0
  centerline_weight: -0.083   # pending #491's ablation result — see note above
  centerline_exp: 2.0
  speed_weight: 0.042
  step_penalty: -0.05
  finish_bonus: 5000.0
  finish_time_weight: -5.0
  par_time_s: 60.0
  accel_bonus: 0.5
  airborne_penalty: -0.83
  lidar_wall_weight: -5.0
  crash_threshold_m: 25.0
